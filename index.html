<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BubbleGrid</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f3f3f1;--bd:#d8d8d4;--ac:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171717;--fg:#eee;--mut:#9a9a9a;--card:#262626;--bd:#3a3a3a}}
:root[data-theme="dark"]{--bg:#171717;--fg:#eee;--mut:#9a9a9a;--card:#262626;--bd:#3a3a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:20px;margin:6px 0 10px}
nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
button,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
button.on,nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
input{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
.panel{display:none}.panel.show{display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
canvas{max-width:100%;height:auto;border:1px solid var(--bd);border-radius:6px;background:#fff}
#keyg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.kr{display:flex;gap:5px;align-items:center;background:var(--card);padding:5px 8px;border-radius:8px}
.kr b{width:26px}.kr button{padding:4px 10px}
.box{background:var(--card);border-radius:10px;padding:10px 12px;margin:10px 0}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--bd)}
.mut{color:var(--mut);font-size:13px}.big{font-size:22px;font-weight:600}
@media print{h1,nav,.noprint{display:none!important}main{padding:0}#sheet{border:0;width:100%}}
</style></head><body><main>
<h1>BubbleGrid <span class="mut">sheet · key · scan</span></h1>
<nav class="noprint">
<button data-t="p1" class="on">1 · Create sheet</button><button data-t="p2">2 · Answer key</button><button data-t="p3">3 · Scan</button>
</nav>

<section id="p1" class="panel show">
<div class="row noprint">
<label>School<input id="school"></label>
<label>Test title<input id="title"></label>
<label>Questions (5–50)<input id="n" type="number" min="5" max="50" style="width:90px"></label>
<button onclick="window.print()">Print sheet</button>
</div>
<canvas id="sheet" width="1600" height="2200"></canvas>
<p class="mut noprint">Print at 100% scale on plain white paper. Keep the four black corner squares clean; the scanner needs them.</p>
</section>

<section id="p2" class="panel">
<div class="row"><button id="rnd">Random key (for testing)</button><button id="clr">Clear key</button></div>
<div id="keyg"></div>
</section>

<section id="p3" class="panel">
<div class="row">
<button id="camb" class="on">📷 Scan with camera</button><input id="cam" type="file" accept="image/*" capture="environment" hidden>
<label>Or upload a photo<input id="file" type="file" accept="image/*"></label>
<label>Fill threshold %<input id="sens" type="number" value="45" min="15" max="85" style="width:80px"></label>
<button id="sim">Simulate student</button>
</div>
<div id="msg" class="mut">Upload a photo (whole sheet visible, all 4 corner squares in frame, upright) or press Simulate student.</div>
<div id="sum" class="box" style="display:none">
<div class="big" id="score"></div><div class="mut" id="flags"></div>
<div class="row" style="margin:8px 0 0"><label>Student name<input id="nm"></label><button id="add">Add to results</button></div>
</div>
<canvas id="out" width="10" height="10" style="display:none"></canvas>
<div class="box"><b>Results</b> <span class="mut" id="cnt"></span>
<table id="tb"></table>
<div class="row" style="margin:8px 0 0"><button id="csv">Copy CSV</button><button id="rc">Clear results</button></div></div>
</section>

<script>
const $=id=>document.getElementById(id),W=800,H=1100,R=12,M=[[35,35],[765,35],[35,1065],[765,1065]];
let ex={school:'Al Rowad International School',title:'Mid Term Test',n:20,key:[]},res=[],last=null;
try{const o=JSON.parse(localStorage.getItem('bg')||'null');if(o){ex=o.ex||ex;res=o.res||res}}catch(e){}
const save=()=>{try{localStorage.setItem('bg',JSON.stringify({ex,res}))}catch(e){}};
function fixKey(){ex.key=Array.from({length:ex.n},(_,i)=>ex.key[i]>=0?ex.key[i]:-1)}

// ---- shared layout: sheet generator and scanner both use this ----
function layout(n){const rows=Math.ceil(n/2);return Array.from({length:n},(_,q)=>{const c=q>=rows?1:0,r=q-c*rows,x0=c?490:130;return{q,c,nx:c?460:100,y:200+r*32+16,xs:[0,1,2,3].map(i=>x0+i*40)}})}

function drawSheet(cv,ans,sc){
 const c=cv.getContext('2d');c.setTransform(sc,0,0,sc,0,0);c.fillStyle='#fff';c.fillRect(0,0,W,H);
 c.fillStyle='#000';M.forEach(([x,y])=>c.fillRect(x-15,y-15,30,30));
 c.textAlign='center';c.font='bold 24px sans-serif';c.fillText(ex.school,400,62);
 c.font='bold 17px sans-serif';c.fillText(ex.title+' — Answer Bubble Sheet',400,90);
 c.font='13px sans-serif';c.fillStyle='#444';c.fillText('Fill one bubble per row completely with black/blue pen.',400,112);
 c.textAlign='left';c.fillStyle='#000';c.font='15px sans-serif';
 [['Student Name:',60,145,260],['ID Number:',430,145,200],['Class:',60,175,120],['Section:',430,175,120]].forEach(([t,x,y,l])=>{c.fillText(t,x,y);c.fillRect(x+c.measureText(t).width+6,y+3,l,1)});
 c.fillRect(50,190,700,1.5);
 layout(ex.n).forEach(p=>{
  c.textAlign='right';c.font='bold 15px sans-serif';c.fillStyle='#000';c.fillText(p.q+1,p.nx,p.y+5);
  c.fillStyle='#ddd';c.fillRect(p.c?420:60,p.y+16,320,.6);
  p.xs.forEach((x,i)=>{c.beginPath();c.arc(x,p.y,R,0,7);
   if(ans&&ans[p.q]===i){c.fillStyle='#111';c.fill()}
   else{c.lineWidth=1.5;c.strokeStyle='#000';c.stroke();c.fillStyle='#333';c.textAlign='center';c.font='11px sans-serif';c.fillText('ABCD'[i],x,p.y+4)}});
 });
}
function refresh(){drawSheet($('sheet'),null,2);rk();save()}

// ---- inputs ----
$('school').value=ex.school;$('title').value=ex.title;$('n').value=ex.n;
$('school').oninput=e=>{ex.school=e.target.value;refresh()};
$('title').oninput=e=>{ex.title=e.target.value;refresh()};
$('n').oninput=e=>{const v=Math.max(5,Math.min(50,+e.target.value||5));ex.n=v;fixKey();refresh()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('show',p.id===b.dataset.t))});

// ---- answer key ----
function rk(){const e=$('keyg');e.innerHTML='';for(let q=0;q<ex.n;q++){const r=document.createElement('div');r.className='kr';r.innerHTML='<b>'+(q+1)+'</b>';
 for(let i=0;i<4;i++){const b=document.createElement('button');b.textContent='ABCD'[i];if(ex.key[q]===i)b.className='on';b.onclick=()=>{ex.key[q]=ex.key[q]===i?-1:i;save();rk()};r.append(b)}e.append(r)}}
$('rnd').onclick=()=>{ex.key=Array.from({length:ex.n},()=>Math.floor(Math.random()*4));save();rk()};
$('clr').onclick=()=>{fixKey();ex.key=ex.key.map(()=>-1);save();rk()};

// ---- scanner ----
function solveH(s,d){const A=[];s.forEach(([x,y],i)=>{const[X,Y]=d[i];A.push([x,y,1,0,0,0,-X*x,-X*y,X],[0,0,0,x,y,1,-Y*x,-Y*y,Y])});
 for(let i=0;i<8;i++){let m=i;for(let r=i+1;r<8;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];
  for(let r=0;r<8;r++){if(r===i)continue;const f=A[r][i]/A[i][i];for(let c=i;c<9;c++)A[r][c]-=f*A[i][c]}}
 return A.map((r,i)=>r[8]/r[i])}
const ap=(h,x,y)=>{const d=h[6]*x+h[7]*y+1;return[(h[0]*x+h[1]*y+h[2])/d,(h[3]*x+h[4]*y+h[5])/d]};

function run(src){
 const sw=src.naturalWidth||src.width,sh=src.naturalHeight||src.height,s=Math.min(1,1400/Math.max(sw,sh)),w=Math.round(sw*s),h=Math.round(sh*s);
 const o=$('out'),c=o.getContext('2d');o.width=w;o.height=h;o.style.display='block';c.drawImage(src,0,0,w,h);
 const d=c.getImageData(0,0,w,h).data,N=w*h,g=new Float32Array(N);
 for(let i=0;i<N;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
 // adaptive threshold via integral image
 const W1=w+1,I=new Float64Array(W1*(h+1));
 for(let y=0;y<h;y++){let r=0;for(let x=0;x<w;x++){r+=g[y*w+x];I[(y+1)*W1+x+1]=I[y*W1+x+1]+r}}
 const k=Math.round(Math.min(w,h)/14),b=new Uint8Array(N);
 for(let y=0;y<h;y++){const y0=Math.max(0,y-k),y1=Math.min(h,y+k+1);for(let x=0;x<w;x++){const x0=Math.max(0,x-k),x1=Math.min(w,x+k+1);
  const m=(I[y1*W1+x1]-I[y0*W1+x1]-I[y1*W1+x0]+I[y0*W1+x0])/((x1-x0)*(y1-y0));b[y*w+x]=g[y*w+x]<m*.8?1:0}}
 // find solid squares (corner markers) by connected components
 const seen=new Uint8Array(N),st=new Int32Array(N),cand=[];
 for(let i=0;i<N;i++){if(!b[i]||seen[i])continue;let sp=0,n=0,x0=w,x1=0,y0=h,y1=0;st[sp++]=i;seen[i]=1;
  while(sp){const p=st[--sp],x=p%w,y=(p/w)|0;n++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
   if(x>0&&b[p-1]&&!seen[p-1]){seen[p-1]=1;st[sp++]=p-1}
   if(x<w-1&&b[p+1]&&!seen[p+1]){seen[p+1]=1;st[sp++]=p+1}
   if(y>0&&b[p-w]&&!seen[p-w]){seen[p-w]=1;st[sp++]=p-w}
   if(y<h-1&&b[p+w]&&!seen[p+w]){seen[p+w]=1;st[sp++]=p+w}}
  const bw=x1-x0+1,bh=y1-y0+1,r=bw/bh;
  if(bw>8&&bh>8&&bw<w*.12&&bh<w*.12&&r>.7&&r<1.4&&n/(bw*bh)>.65)cand.push([(x0+x1)/2,(y0+y1)/2,bw])}
 const T=[[0,0],[w,0],[0,h],[w,h]],pk=T.map(t=>cand.reduce((a,q)=>!a||Math.hypot(q[0]-t[0],q[1]-t[1])<Math.hypot(a[0]-t[0],a[1]-t[1])?q:a,null));
 const ws=pk.map(p=>p&&p[2]);
 if(pk.some(p=>!p)||new Set(pk).size<4||Math.max(...ws)/Math.min(...ws)>1.6){$('msg').textContent='Could not find all 4 corner squares. Keep the whole sheet in frame, upright, with even lighting.';$('sum').style.display='none';return}
 const Hm=solveH(M,pk.map(p=>[p[0],p[1]])),sc=Math.hypot(pk[1][0]-pk[0][0],pk[1][1]-pk[0][1])/730;
 const sens=(+$('sens').value||45)/100,lay=layout(ex.n);let score=0,blank=[],multi=[],unkeyed=0;
 const ans=lay.map(p=>{
  const f=p.xs.map(x=>{let t=0,dk=0;for(let dy=-6;dy<=6;dy+=2)for(let dx=-6;dx<=6;dx+=2){if(dx*dx+dy*dy>42)continue;const[px,py]=ap(Hm,x+dx,p.y+dy),ix=Math.round(px),iy=Math.round(py);if(ix<0||iy<0||ix>=w||iy>=h)continue;t++;dk+=b[iy*w+ix]}return t?dk/t:0});
  const m=f.map((v,i)=>v>=sens?i:-1).filter(i=>i>=0);
  if(!m.length){blank.push(p.q+1);return -1}if(m.length>1){multi.push(p.q+1);return -2}return m[0]});
 // overlay
 const ring=(pt,col,lw,fill)=>{c.beginPath();c.arc(pt[0],pt[1],R*sc*(fill?1:1.35),0,7);c.lineWidth=lw;c.strokeStyle=col;if(fill){c.fillStyle=fill;c.fill()}c.stroke()};
 lay.forEach(p=>{const kk=ex.key[p.q],a=ans[p.q],pt=i=>ap(Hm,p.xs[i],p.y);
  if(kk<0)unkeyed++;
  if(a>=0&&a===kk){score++;ring(pt(a),'#16a34a',3,'rgba(22,163,74,.35)')}
  else{if(kk>=0)ring(pt(kk),'#16a34a',3);if(a>=0)ring(pt(a),'#dc2626',3,'rgba(220,38,38,.35)');if(a<0)for(let i=0;i<4;i++)ring(pt(i),'#d97706',2)}});
 $('msg').textContent='Scanned. Green = correct, red = wrong, orange = blank or multiple marks.';
 $('sum').style.display='block';$('score').textContent='Score: '+score+' / '+ex.n;
 $('flags').textContent=(blank.length?'Blank: Q'+blank.join(', Q')+'. ':'')+(multi.length?'Multiple marks: Q'+multi.join(', Q')+'. ':'')+(unkeyed?unkeyed+' question(s) have no key set.':'');
 last={score,n:ex.n,blank:blank.length,multi:multi.length};
}

$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>run(im);im.src=fr.result};fr.readAsDataURL(f);e.target.value=''};
$('cam').onchange=$('file').onchange;$('camb').onclick=()=>$('cam').click();
$('sens').onchange=()=>{};
$('sim').onclick=()=>{
 if(ex.key.some(k=>k<0)){ex.key=Array.from({length:ex.n},(_,i)=>ex.key[i]>=0?ex.key[i]:Math.floor(Math.random()*4));save();rk()}
 const ans=ex.key.map(k=>Math.random()<.7?k:(Math.random()<.12?-1:(k+1+Math.floor(Math.random()*3))%4));
 const sh=document.createElement('canvas');sh.width=W;sh.height=H;drawSheet(sh,ans,1);
 const ph=document.createElement('canvas');ph.width=1000;ph.height=1300;const c=ph.getContext('2d');c.fillStyle='#8a7f72';c.fillRect(0,0,1000,1300);
 c.translate(510,640);c.rotate(.05);c.scale(1.1,1.1);c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=20;c.drawImage(sh,-400,-550);
 run(ph)};
$('add').onclick=()=>{if(!last)return;res.push({name:$('nm').value||'Student '+(res.length+1),...last});$('nm').value='';save();rr()};
function rr(){$('cnt').textContent='('+res.length+')';$('tb').innerHTML='<tr><th>Name</th><th>Score</th><th>%</th><th>Blank/Multi</th></tr>'+res.map(r=>'<tr><td></td><td>'+r.score+'/'+r.n+'</td><td>'+Math.round(100*r.score/r.n)+'</td><td>'+r.blank+'/'+r.multi+'</td></tr>').join('');
 [...$('tb').rows].slice(1).forEach((tr,i)=>tr.cells[0].textContent=res[i].name)}
$('csv').onclick=()=>{const t='Name,Score,Total,Percent\n'+res.map(r=>'"'+r.name.replace(/"/g,'""')+'",'+r.score+','+r.n+','+Math.round(100*r.score/r.n)).join('\n');try{navigator.clipboard.writeText(t)}catch(e){}};
$('rc').onclick=()=>{res=[];save();rr()};
fixKey();refresh();rr();
</script></main></body></html>
